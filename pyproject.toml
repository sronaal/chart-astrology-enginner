[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astrology-chart-engine"
version = "0.2.0"
description = "Deterministic natal chart calculation engine with auth and PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pysweph",
    "pydantic",
    "pydantic-settings",
    "uvicorn",
    # Auth
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "bcrypt<5.0.0",
    "python-multipart",
    # Database
    "asyncpg",
    # Validation
    "email-validator",
    # Rate limiting
    "slowapi",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source_pkgs = ["chart_engine"]

[tool.coverage.report]
show_missing = true
fail_under = 90
